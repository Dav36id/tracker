```yaml
name: R15 Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. DESCARREGAR REPOSITORI
      # --------------------------------------------------
      - name: Descarregar repositori
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. CONFIGURAR PYTHON
      # --------------------------------------------------
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------
      # 3. INSTAL·LAR DEPENDÈNCIES
      # --------------------------------------------------
      - name: Instal·lar dependències
        run: |
          pip install requests

      # --------------------------------------------------
      # 4. INVESTIGAR FEEDS REALTIME DE RENFE
      #
      # Aquest pas va abans de collect.py expressament.
      # Així podem investigar Renfe encara que el GTFS
      # de la Generalitat no estiga disponible.
      # --------------------------------------------------
      - name: Investigar feeds Renfe
        continue-on-error: true
        run: |
          python collector/probe_realtime.py

      # --------------------------------------------------
      # 5. GENERAR HORARIS DEL DIA
      # --------------------------------------------------
      - name: Generar horaris del dia
        continue-on-error: true
        run: |
          python collector/collect.py

      # --------------------------------------------------
      # 6. ACTUALITZAR TEMPS REAL
      # --------------------------------------------------
      - name: Actualitzar temps real
        continue-on-error: true
        run: |
          python collector/realtime.py

      # --------------------------------------------------
      # 7. INVESTIGAR FEEDS ADDICIONALS
      #
      # Mantinc aquest pas perquè ja el tenies al workflow.
      # --------------------------------------------------
      - name: Investigar feeds Renfe addicionals
        continue-on-error: true
        run: |
          python collector/probe_renfe.py

      # --------------------------------------------------
      # 8. GUARDAR DADES
      # --------------------------------------------------
      - name: Guardar dades al repositori
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No hi ha canvis per guardar"
          else
            git commit -m "Actualitzar dades R15"
            git push
          fi
```
